version: '3.8'

services:
  vet-cms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: vet-cms
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - vet-network

networks:
  vet-network:
    driver: bridge

